#主配置文件

spring:
  # 激活环境配置
  profiles:
    active: dev
  # 文件编码 UTF8
  mandatory-file-encoding: UTF-8
  mvc:
    # 404 交给异常处理器处理
    throw-exception-if-no-handler-found: true
    static-path-pattern: /**
  resources:
    # 启用静态资源映射（前端页面）
    add-mappings: true
    static-locations: classpath:/static/,file:./static/
  web:
    resources:
      chain:
        enabled: true
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      exclude: WEB-INF/**
  freemarker:
    cache: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.extension.handlers.MybatisEnumTypeHandler
  global-config:
    banner: false
    db-config:
      logic-delete-value: NOW()
      logic-not-delete-value: 'NULL'
  mapper-locations: classpath:mapper/*.xml


lin:
  cms:
    logger-enabled: true
    token-access-expire: 3600
    token-refresh-expire: 2592000
    token-secret: ${LIN_TOKEN_SECRET:local-development-secret-change-before-deployment}
  file:
    domain: http://localhost:5000/
    serve-path: assets/**

# 长安链配置
chain:
  changAn:
    enabled: true
    node-addr: 127.0.0.1:12301
    chain-id: chain1
    org-id: organization1
    user-cert-path: /opt/chainmaker/crypto-config/wx-org1.chainmaker.org/user/client1/client1.sign.crt
    user-key-path: /opt/chainmaker/crypto-config/wx-org1.chainmaker.org/user/client1/client1.sign.key
    tls-cert-path: /opt/chainmaker/crypto-config/wx-org1.chainmaker.org/ca.crt
    contract-name: recruit_contract
    timeout: 10000
    retry-times: 3

logging:
  file:
    max-history:
  config:
