# 测试环境环境配置

server:
  # 服务端口
  port: 5000

logging:
  level:
  # SQL日志记录
    com.recruit.mapper: debug

spring:
  # 数据源配置，
  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/recruit?useSSL=false&serverTimezone=UTC&characterEncoding=UTF8&

# 开启权限拦截
auth:
  enabled: true

# 开启请求日志记录
request-log:
  enabled: true
