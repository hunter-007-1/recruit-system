<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招聘系统 - 智能招聘平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Century Gothic", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .header {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2E5CD5;
            cursor: pointer;
        }
        .nav {
            display: flex;
            gap: 32px;
        }
        .nav a {
            color: #555;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .nav a:hover, .nav a.active {
            color: #2E5CD5;
            background: #f0f5ff;
        }
        .user-box {
            display: flex;
            gap: 12px;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #2E5CD5;
            color: #fff;
        }
        .btn-primary:hover { background: #1e4bb8; }
        .btn-outline {
            background: #fff;
            color: #2E5CD5;
            border: 1px solid #2E5CD5;
        }
        .btn-outline:hover { background: #f0f5ff; }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }
        .hero {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .hero h1 {
            font-size: 48px;
            color: #2E5CD5;
            margin-bottom: 16px;
        }
        .hero p {
            font-size: 18px;
            color: #666;
            margin-bottom: 24px;
        }
        .search-bar {
            display: flex;
            max-width: 700px;
            margin: 32px auto 0;
            gap: 12px;
        }
        .search-bar input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar input:focus { border-color: #2E5CD5; }
        .search-bar select {
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background: #fff;
            cursor: pointer;
            outline: none;
        }
        .section-title {
            color: #fff;
            font-size: 28px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .job-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.3s;
        }
        .job-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        .job-title {
            font-size: 18px;
            font-weight: 600;
            color: #222;
            margin-bottom: 8px;
        }
        .job-salary {
            color: #ff5722;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .job-company {
            color: #666;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .job-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .tag {
            background: #f0f5ff;
            color: #2E5CD5;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
        }
        .job-footer {
            display: flex;
            justify-content: space-between;
            color: #999;
            font-size: 13px;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
        }
        .companies {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 40px;
        }
        .companies h2 {
            font-size: 24px;
            margin-bottom: 24px;
            color: #222;
        }
        .companies-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .company-item {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .company-item:hover {
            background: #e8f0fe;
        }
        .company-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .company-desc {
            font-size: 13px;
            color: #888;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            width: 400px;
            max-width: 90%;
        }
        .modal-box h2 {
            color: #2E5CD5;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #2E5CD5;
        }
        .modal-btns {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .modal-btns .btn { flex: 1; }
        .toast {
            position: fixed;
            top: 80px;
            right: 24px;
            background: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            z-index: 2000;
            display: none;
            animation: slideIn 0.3s;
        }
        .toast.show { display: block; }
        .toast.success { border-left: 4px solid #4caf50; }
        .toast.error { border-left: 4px solid #f44336; }
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .loading { text-align: center; padding: 40px; color: #fff; font-size: 16px; }
        .empty { text-align: center; padding: 40px; color: #fff; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div class="logo" onclick="switchPage('jobs')">💼 智能招聘平台</div>
            <div class="nav">
                <a onclick="switchPage('jobs')" class="active" data-page="jobs">职位</a>
                <a onclick="switchPage('companies')" data-page="companies">公司</a>
                <a onclick="switchPage('category')" data-page="category">分类</a>
                <a onclick="switchPage('my')" data-page="my">我的</a>
            </div>
            <div class="user-box" id="userBox">
                <button class="btn btn-outline" onclick="showModal('loginModal')">登录</button>
                <button class="btn btn-primary" onclick="showModal('registerModal')">注册</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="jobs-page" class="page">
            <div class="hero">
                <h1>再小的帆，也能远航！</h1>
                <p>发现优秀岗位，开启你的职业旅程</p>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="搜索职位名称、公司...">
                    <button class="btn btn-primary" onclick="searchJobs()">🔍 搜索</button>
                </div>
            </div>

            <div class="section-title">
                <span>热门职位</span>
                <span style="font-size: 14px; opacity: 0.8;" id="jobCount"></span>
            </div>
            <div id="jobsList" class="jobs-grid"></div>
        </div>

        <div id="companies-page" class="page" style="display: none;">
            <div class="companies">
                <h2>🏢 合作企业</h2>
                <div id="companiesList" class="companies-list"></div>
            </div>
        </div>

        <div id="category-page" class="page" style="display: none;">
            <div class="companies">
                <h2>📂 职位分类</h2>
                <div id="categoryList" class="jobs-grid"></div>
            </div>
        </div>

        <div id="my-page" class="page" style="display: none;">
            <div class="companies">
                <h2>👤 个人中心</h2>
                <div id="myContent">
                    <p style="color: #888; text-align: center; padding: 40px;">请先登录查看个人中心</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 登录弹窗 -->
    <div class="modal" id="loginModal">
        <div class="modal-box">
            <h2>用户登录</h2>
            <div class="form-group">
                <label>账号 (username)</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码 (password)</label>
                <input type="password" id="loginPassword" placeholder="请输入密码">
            </div>
            <div class="modal-btns">
                <button class="btn btn-outline" onclick="hideModal('loginModal')">取消</button>
                <button class="btn btn-primary" onclick="doLogin()">登录</button>
            </div>
        </div>
    </div>

    <!-- 注册弹窗 -->
    <div class="modal" id="registerModal">
        <div class="modal-box">
            <h2>用户注册</h2>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="regUsername" placeholder="用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="密码">
            </div>
            <div class="form-group">
                <label>昵称</label>
                <input type="text" id="regNickname" placeholder="昵称">
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="text" id="regPhone" placeholder="手机号">
            </div>
            <div class="modal-btns">
                <button class="btn btn-outline" onclick="hideModal('registerModal')">取消</button>
                <button class="btn btn-primary" onclick="doRegister()">注册</button>
            </div>
        </div>
    </div>

    <!-- 职位详情弹窗 -->
    <div class="modal" id="jobDetailModal">
        <div class="modal-box" style="width: 560px;">
            <h2 id="jobDetailTitle">职位详情</h2>
            <div id="jobDetailContent" style="line-height: 1.8; color: #555;"></div>
            <div class="modal-btns">
                <button class="btn btn-outline" onclick="hideModal('jobDetailModal')">关闭</button>
                <button class="btn btn-primary" onclick="applyJob()">申请职位</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = '/recruit';
        let currentPage = 'jobs';
        let token = localStorage.getItem('token') || '';
        let currentJobId = null;

        // 页面切换
        function switchPage(page) {
            currentPage = page;
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(page + '-page').style.display = 'block';
            document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
            document.querySelector(`[data-page="${page}"]`).classList.add('active');

            if (page === 'jobs') loadJobs();
            if (page === 'companies') loadCompanies();
            if (page === 'category') loadCategories();
            if (page === 'my') loadMyInfo();
        }

        // 加载职位列表
        function loadJobs(keyword = '') {
            const list = document.getElementById('jobsList');
            list.innerHTML = '<div class="loading">加载中...</div>';

            const url = keyword
                ? `${API_BASE}/position/page/keyword?keyword=${encodeURIComponent(keyword)}`
                : `${API_BASE}/position/page/1`;

            fetch(url, { headers: getAuthHeaders() })
                .then(r => r.json())
                .then(data => {
                    const items = data.data?.items || data.data || [];
                    document.getElementById('jobCount').textContent = `共 ${items.length} 个职位`;
                    if (items.length === 0) {
                        list.innerHTML = '<div class="empty">暂无职位数据，请先添加测试数据</div>';
                        return;
                    }
                    list.innerHTML = items.map(job => `
                        <div class="job-card" onclick='showJobDetail(${JSON.stringify(job).replace(/'/g, "&apos;")})'>
                            <div class="job-title">${escapeHtml(job.title || job.positionName || job.name || '未知职位')}</div>
                            <div class="job-salary">${job.salary || '面议'}</div>
                            <div class="job-company">${escapeHtml(job.companyName || '未知公司')}</div>
                            <div class="job-tags">
                                ${job.categoryName ? `<span class="tag">${escapeHtml(job.categoryName)}</span>` : ''}
                                ${job.city ? `<span class="tag">${escapeHtml(job.city)}</span>` : ''}
                                ${job.education ? `<span class="tag">${escapeHtml(job.education)}</span>` : ''}
                            </div>
                            <div class="job-footer">
                                <span>${job.viewCount || 0} 次浏览</span>
                                <span>${new Date(job.createTime || Date.now()).toLocaleDateString()}</span>
                            </div>
                        </div>
                    `).join('');
                })
                .catch(() => {
                    list.innerHTML = '<div class="empty">加载失败，请检查后端服务</div>';
                });
        }

        function searchJobs() {
            const kw = document.getElementById('searchInput').value.trim();
            loadJobs(kw);
        }

        // 加载公司列表
        function loadCompanies() {
            const list = document.getElementById('companiesList');
            list.innerHTML = '<div style="grid-column: 1/-1; padding: 20px; color:#888;">加载中...</div>';

            fetch(`${API_BASE}/company/page/1`, { headers: getAuthHeaders() })
                .then(r => r.json())
                .then(data => {
                    const items = data.data?.items || data.data || [];
                    if (items.length === 0) {
                        list.innerHTML = '<div style="grid-column: 1/-1; padding: 40px; color:#888; text-align: center;">暂无公司数据</div>';
                        return;
                    }
                    list.innerHTML = items.map(c => `
                        <div class="company-item">
                            <div class="company-name">${escapeHtml(c.name || c.companyName || '未知公司')}</div>
                            <div class="company-desc">${escapeHtml(c.description || c.industry || '暂无描述')}</div>
                        </div>
                    `).join('');
                })
                .catch(() => {
                    list.innerHTML = '<div style="grid-column: 1/-1; padding: 40px; color:#888; text-align: center;">加载失败</div>';
                });
        }

        // 加载分类
        function loadCategories() {
            const list = document.getElementById('categoryList');
            list.innerHTML = '<div class="empty">加载中...</div>';

            fetch(`${API_BASE}/category/show`, { headers: getAuthHeaders() })
                .then(r => r.json())
                .then(data => {
                    const items = data.data || [];
                    if (items.length === 0) {
                        list.innerHTML = '<div class="empty">暂无分类数据</div>';
                        return;
                    }
                    list.innerHTML = items.map(cat => `
                        <div class="job-card" onclick="loadJobs('${escapeHtml(cat.name)}'); switchPage('jobs');">
                            <div class="job-title">${escapeHtml(cat.name)}</div>
                            <div class="job-company">${escapeHtml(cat.description || '点击查看该分类下的职位')}</div>
                        </div>
                    `).join('');
                })
                .catch(() => {
                    list.innerHTML = '<div class="empty">加载失败</div>';
                });
        }

        // 职位详情
        function showJobDetail(job) {
            currentJobId = job.id;
            document.getElementById('jobDetailTitle').textContent = job.title || job.positionName || '职位详情';
            document.getElementById('jobDetailContent').innerHTML = `
                <p><strong>薪资：</strong>${job.salary || '面议'}</p>
                <p><strong>公司：</strong>${escapeHtml(job.companyName || '未知')}</p>
                <p><strong>城市：</strong>${escapeHtml(job.city || '未填写')}</p>
                <p><strong>学历要求：</strong>${escapeHtml(job.education || '未填写')}</p>
                <p><strong>工作经验：</strong>${escapeHtml(job.experience || '未填写')}</p>
                <p style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #eee;">
                    <strong>职位描述：</strong><br>
                    ${escapeHtml(job.description || job.content || '暂无描述').replace(/\n/g, '<br>')}
                </p>
            `;
            showModal('jobDetailModal');
        }

        function applyJob() {
            if (!token) {
                showToast('请先登录', 'error');
                hideModal('jobDetailModal');
                showModal('loginModal');
                return;
            }
            if (!currentJobId) return;
            fetch(`${API_BASE}/application`, {
                method: 'POST',
                headers: { ...getAuthHeaders(), 'Content-Type': 'application/json' },
                body: JSON.stringify({ positionId: currentJobId })
            }).then(r => r.json()).then(data => {
                if (data.code === 200 || data.success) {
                    showToast('申请成功！', 'success');
                } else {
                    showToast(data.message || '申请失败', 'error');
                }
                hideModal('jobDetailModal');
            });
        }

        // 登录
        function doLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            if (!username || !password) {
                showToast('请输入用户名和密码', 'error');
                return;
            }
            fetch(`${API_BASE}/user/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            }).then(r => r.json()).then(data => {
                if (data.code === 200 || data.success) {
                    token = data.data?.token || data.token || 'demo-token';
                    localStorage.setItem('token', token);
                    localStorage.setItem('user', username);
                    showToast('登录成功！', 'success');
                    hideModal('loginModal');
                    updateUserBox();
                } else {
                    showToast(data.message || '登录失败', 'error');
                }
            }).catch(() => {
                // 开发环境没有真实用户时，模拟登录
                token = 'demo-token';
                localStorage.setItem('token', token);
                localStorage.setItem('user', username);
                showToast('已模拟登录', 'success');
                hideModal('loginModal');
                updateUserBox();
            });
        }

        function doRegister() {
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const nickname = document.getElementById('regNickname').value;
            const phone = document.getElementById('regPhone').value;
            if (!username || !password) {
                showToast('请填写用户名和密码', 'error');
                return;
            }
            fetch(`${API_BASE}/user/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, nickname, phone })
            }).then(r => r.json()).then(data => {
                if (data.code === 200 || data.success) {
                    showToast('注册成功！', 'success');
                    hideModal('registerModal');
                } else {
                    showToast(data.message || '注册失败', 'error');
                }
            }).catch(() => {
                showToast('模拟注册成功（开发环境）', 'success');
                hideModal('registerModal');
            });
        }

        function doLogout() {
            token = '';
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            updateUserBox();
            showToast('已退出登录', 'success');
        }

        function loadMyInfo() {
            const content = document.getElementById('myContent');
            if (!token) {
                content.innerHTML = '<p style="color: #888; text-align: center; padding: 40px;">请先登录查看个人中心</p>';
                return;
            }
            content.innerHTML = `
                <div style="padding: 20px; background: #f8f9fa; border-radius: 8px; margin-bottom: 20px;">
                    <p><strong>用户名：</strong>${localStorage.getItem('user') || '未登录'}</p>
                    <p><strong>Token：</strong>${token.substring(0, 20)}...</p>
                </div>
                <div style="color: #888; text-align: center;">
                    更多功能请通过 API 调用
                </div>
            `;
        }

        function getAuthHeaders() {
            return token ? { 'Authorization': 'Bearer ' + token } : {};
        }

        function updateUserBox() {
            const box = document.getElementById('userBox');
            if (token) {
                box.innerHTML = `
                    <span style="line-height: 38px; color: #666;">你好, ${localStorage.getItem('user') || '用户'}</span>
                    <button class="btn btn-outline" onclick="doLogout()">退出</button>
                `;
            } else {
                box.innerHTML = `
                    <button class="btn btn-outline" onclick="showModal('loginModal')">登录</button>
                    <button class="btn btn-primary" onclick="showModal('registerModal')">注册</button>
                `;
            }
        }

        function showModal(id) { document.getElementById(id).classList.add('show'); }
        function hideModal(id) { document.getElementById(id).classList.remove('show'); }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + type;
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // 初始化
        updateUserBox();
        loadJobs();
    </script>
</body>
</html>
